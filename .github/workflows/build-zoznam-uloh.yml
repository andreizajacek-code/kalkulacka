name: Build ZOZNAM ULOH installable APK

on:
  push:
    branches:
      - zoznam-uloh-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          cat zoznam-uloh-build-payload/part-00.b64 zoznam-uloh-build-payload/part-01.b64 zoznam-uloh-build-payload/part-02.b64 zoznam-uloh-build-payload/part-03.b64 zoznam-uloh-build-payload/part-04.b64 zoznam-uloh-build-payload/part-05-00.b64 zoznam-uloh-build-payload/part-05-01.b64 zoznam-uloh-build-payload/part-05-02.b64 zoznam-uloh-build-payload/part-05-03.b64 > source.b64
          base64 -d source.b64 > ZOZNAM_ULOH_source.zip
          unzip -q ZOZNAM_ULOH_source.zip

      - name: Apply app changes
        shell: bash
        run: |
          cp zoznam-uloh-overrides/Ui.java ZOZNAM_ULOH/app/src/main/java/sk/zoznamuloh/app/Ui.java
          cp zoznam-uloh-overrides/AppSettings.java ZOZNAM_ULOH/app/src/main/java/sk/zoznamuloh/app/AppSettings.java
          cp zoznam-uloh-overrides/NotificationHelper.java ZOZNAM_ULOH/app/src/main/java/sk/zoznamuloh/app/NotificationHelper.java
          cp zoznam-uloh-overrides/OverlayService.java ZOZNAM_ULOH/app/src/main/java/sk/zoznamuloh/app/OverlayService.java
          cp zoznam-uloh-overrides/SettingsActivity.java ZOZNAM_ULOH/app/src/main/java/sk/zoznamuloh/app/SettingsActivity.java
          python zoznam-uloh-overrides/TaskEditorActivity.patch.py
          python zoznam-uloh-overrides/MainActivity.patch.py
          python zoznam-uloh-overrides/Manifest.patch.py
          python zoznam-uloh-overrides/StablePackage.patch.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build unsigned release APK
        working-directory: ZOZNAM_ULOH
        run: gradle --no-daemon assembleRelease

      - name: Create signing key and sign with Android apksigner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          PASS=$(openssl rand -hex 16)
          printf '%s' "$PASS" > signing/password.txt
          keytool -genkeypair -v             -keystore signing/zoznam-uloh.jks             -storepass "$PASS"             -keypass "$PASS"             -alias zoznamuloh             -keyalg RSA -keysize 4096 -validity 10000             -dname "CN=ZOZNAM ULOH, O=Personal App, C=SK"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4             ZOZNAM_ULOH/app/build/outputs/apk/release/app-release-unsigned.apk             ZOZNAM-ULOH-aligned.apk
          "$BT/apksigner" sign             --ks signing/zoznam-uloh.jks             --ks-key-alias zoznamuloh             --ks-pass "pass:$PASS"             --key-pass "pass:$PASS"             --out ZOZNAM-ULOH-v5-FIX.apk             ZOZNAM-ULOH-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs ZOZNAM-ULOH-v5-FIX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZOZNAM-ULOH-v5-FIX-APK
          path: ZOZNAM-ULOH-v5-FIX.apk
          if-no-files-found: error

      - name: Upload signing bundle
        uses: actions/upload-artifact@v4
        with:
          name: ZOZNAM-ULOH-v5-SIGNING
          path: signing
          if-no-files-found: error
          retention-days: 90
