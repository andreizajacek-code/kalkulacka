name: Build UM WORK compatible update

on:
  push:
    branches:
      - um-work-apk
    paths:
      - 'um-work-android/**'
      - '.github/workflows/build-um-work-compatible-update.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: um-work-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore original UM WORK signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: umwork-debug-keystore-v2
          fail-on-cache-miss: true

      - name: Check signing certificate
        shell: bash
        run: |
          ACTUAL=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED="deced67557b086f4f64a631230ebc930d897b96ac0a9a40b0d81d429228fa8c8"
          echo "Signing cert: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Signing key does not match installed UM WORK."
            exit 1
          fi

      - name: Build signed release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Verify package and signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -n 3

      - name: Copy APK
        run: cp app/build/outputs/apk/release/app-release.apk ../UM-WORK-v2.1-UPDATE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UM-WORK-v2.1-UPDATE
          path: UM-WORK-v2.1-UPDATE.apk
          if-no-files-found: error
