name: Build UM WORK stable unsigned

on:
  push:
    branches:
      - um-work-apk
    paths:
      - 'um-work-android/**'
      - '.github/workflows/build-um-work-stable-unsigned.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: um-work-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build unsigned release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Copy unsigned APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk ../UM-WORK-STABLE-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UM-WORK-STABLE-unsigned
          path: UM-WORK-STABLE-unsigned.apk
          if-no-files-found: error
